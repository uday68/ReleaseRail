services:
  proxy:
    image: nginx:alpine
    container_name: pipeforge-proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8085}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - pipeforge-blue

  pipeforge-blue:
    image: ${BLUE_IMAGE:-pipeforge-service:1.0.0}
    container_name: pipeforge-blue
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PIPEFORGE_HOST=0.0.0.0
      - PIPEFORGE_PORT=8080
      - PIPEFORGE_READ_TIMEOUT=5s
      - PIPEFORGE_WRITE_TIMEOUT=10s
      - PIPEFORGE_IDLE_TIMEOUT=60s
      - PIPEFORGE_SHUTDOWN_TIMEOUT=10s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s

  pipeforge-green:
    image: ${GREEN_IMAGE:-pipeforge-service:1.0.0}
    container_name: pipeforge-green
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - PIPEFORGE_HOST=0.0.0.0
      - PIPEFORGE_PORT=8080
      - PIPEFORGE_READ_TIMEOUT=5s
      - PIPEFORGE_WRITE_TIMEOUT=10s
      - PIPEFORGE_IDLE_TIMEOUT=60s
      - PIPEFORGE_SHUTDOWN_TIMEOUT=10s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 2s
